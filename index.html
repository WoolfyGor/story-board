<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Хроники мира — таймлайн</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070914;
    --panel:rgba(17,21,40,.94);
    --panel2:rgba(26,31,58,.94);
    --gold:#e9c57f;
    --gold-soft:rgba(233,197,127,.32);
    --cyan:#8fd8ff;
    --text:#e9ecf6;
    --muted:#9aa3c0;
    --cw:250px;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit}

  .app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto}

  /* ---------- фон ---------- */
  .sky{position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(60vw 45vh at 18% 20%, rgba(80,70,160,.22), transparent 70%),
      radial-gradient(50vw 50vh at 85% 75%, rgba(40,120,170,.18), transparent 70%),
      radial-gradient(40vw 30vh at 60% 10%, rgba(233,197,127,.07), transparent 70%),
      var(--bg)}
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;background-repeat:repeat;opacity:.9}
  .stars.far{opacity:.55}

  /* ---------- шапка ---------- */
  header{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:14px 22px;background:linear-gradient(180deg,rgba(7,9,20,.95),rgba(7,9,20,.6))}
  .brand{display:flex;align-items:center;gap:14px;min-width:0}
  .sigil{width:34px;height:34px;flex:none;border:1px solid var(--gold-soft);transform:rotate(45deg);display:grid;place-items:center}
  .sigil::after{content:"";width:12px;height:12px;background:var(--gold);box-shadow:0 0 14px var(--gold)}
  .brand h1{margin:0;font-family:"Cormorant Garamond",serif;font-weight:700;font-size:26px;letter-spacing:.04em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .sub{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-top:5px}
  .controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .btn{height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:rgba(20,25,48,.75);border:1px solid rgba(233,197,127,.22);cursor:pointer;font-size:13px;color:var(--text);
    clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:background .2s,border-color .2s}
  .btn:hover{background:rgba(40,46,84,.9);border-color:var(--gold)}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
  .btn.on{border-color:var(--gold);color:var(--gold)}
  .sep{width:1px;height:22px;background:rgba(233,197,127,.2);margin:0 4px}

  /* ---------- сцена ---------- */
  .viewport{position:relative;z-index:1;overflow:hidden;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
  .viewport.dragging{cursor:grabbing}
  .world{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
  .axis{position:absolute;top:-1px;height:2px;z-index:1;
    background:linear-gradient(90deg,transparent,rgba(233,197,127,.55) 3%,rgba(233,197,127,.55) 97%,transparent)}
  .axis::after{content:"";position:absolute;inset:-6px 0;background:linear-gradient(90deg,transparent,rgba(233,197,127,.08) 10%,rgba(233,197,127,.08) 90%,transparent);filter:blur(4px)}

  .node{position:absolute;top:0;z-index:3;pointer-events:none}
  .node i{position:absolute;left:-6px;top:-6px;width:12px;height:12px;background:#0d1124;border:2px solid var(--gold);transform:rotate(45deg);transition:background .3s,box-shadow .3s}
  .node.lit i{background:var(--gold);box-shadow:0 0 14px var(--gold)}
  .node b{position:absolute;left:0;top:11px;transform:translateX(-50%);font:500 11px "JetBrains Mono",monospace;color:var(--gold);white-space:nowrap;letter-spacing:.04em;text-shadow:0 0 8px #000;transition:opacity .2s}
  .node b.hide{opacity:0}

  /* подсветка отрезка оси под кластером */
  .span{position:absolute;top:-4px;height:8px;z-index:2;border:1px solid rgba(233,197,127,.55);background:rgba(233,197,127,.12);margin-left:-8px;padding-right:16px;box-sizing:content-box}

  .conn{position:absolute;width:1px;z-index:2;margin-left:-.5px;
    background:linear-gradient(var(--gold-soft),rgba(233,197,127,.7));transition:top .45s var(--ease),height .45s var(--ease)}
  .conn.up{background:linear-gradient(rgba(233,197,127,.7),var(--gold-soft))}
  .conn::after{content:"";position:absolute;left:-3px;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
  .conn.up::after{top:-3px}
  .conn.down::after{bottom:-3px}

  .gone{display:none !important}

  .card{position:absolute;z-index:4;width:var(--cw);cursor:pointer;
    transition:top .45s var(--ease),transform .45s var(--ease)}
  .card.up{transform:translateY(-100%)}
  .card .frame{position:relative;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid rgba(233,197,127,.22);
    clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
    transition:border-color .25s,background .25s}
  .card .frame::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--gold),transparent);opacity:.35;transition:opacity .25s}
  .card:hover .frame{border-color:rgba(233,197,127,.6);background:linear-gradient(160deg,rgba(36,42,78,.96),rgba(20,24,46,.96))}
  .card.open .frame{border-color:var(--gold)}
  .card.open .frame::before{opacity:1}
  .card.focus .frame{animation:pulse 1.4s var(--ease) 1}
  @keyframes pulse{0%{box-shadow:inset 0 0 0 0 rgba(233,197,127,0)}30%{box-shadow:inset 0 0 40px 0 rgba(233,197,127,.35)}100%{box-shadow:inset 0 0 0 0 rgba(233,197,127,0)}}
  .head{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px 11px 16px}
  .c-year{grid-column:1;font:500 11px "JetBrains Mono",monospace;color:var(--gold);letter-spacing:.08em}
  .head h3{grid-column:1;margin:0;font-family:"Cormorant Garamond",serif;font-weight:700;font-size:19px;line-height:1.15}
  .chev{grid-column:2;grid-row:1 / span 2;align-self:center;width:22px;height:22px;display:grid;place-items:center;border:1px solid rgba(233,197,127,.3);transform:rotate(45deg) scale(.8);transition:transform .35s var(--ease),background .25s}
  .chev::after{content:"";width:6px;height:6px;border-right:1.5px solid var(--gold);border-bottom:1.5px solid var(--gold);transform:translate(-1px,-1px)}
  .card.open .chev{transform:rotate(225deg) scale(.8);background:rgba(233,197,127,.12)}
  .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
  .card.open .body{grid-template-rows:1fr}
  .body .inner{overflow:hidden;min-height:0}
  .body .pad{padding:0 14px 14px 16px}
  .body .pad::before{content:"";display:block;height:1px;margin-bottom:10px;background:linear-gradient(90deg,var(--gold-soft),transparent)}
  .body p{margin:0 0 12px;font-size:13.5px;line-height:1.55;color:#c8cee3;cursor:text;user-select:text;-webkit-user-select:text}
  .read{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:#0b0e1c;background:var(--gold);padding:7px 12px;
    clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);transition:filter .2s}
  .read:hover{filter:brightness(1.12)}
  .read.disabled{background:transparent;color:var(--muted);border:1px dashed rgba(154,163,192,.4);clip-path:none;cursor:default}

  /* карточка-группа: несколько близких событий, которые не помещаются на текущем масштабе */
  .card.cluster .frame{background:linear-gradient(160deg,rgba(40,36,70,.95),rgba(20,20,42,.95));border-style:solid;border-color:rgba(233,197,127,.45)}
  .card.cluster .frame::before{opacity:.8}
  .cluster .chev::after{border:none;width:10px;height:10px;transform:rotate(-45deg);
    background:linear-gradient(var(--gold),var(--gold)) center/10px 1.5px no-repeat,linear-gradient(var(--gold),var(--gold)) center/1.5px 10px no-repeat}
  .clist{list-style:none;margin:0;padding:0 14px 12px 16px}
  .clist li{position:relative;padding:3px 0 3px 14px;font-size:12.5px;line-height:1.35;color:#c8cee3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .clist li::before{content:"";position:absolute;left:1px;top:9px;width:5px;height:5px;transform:rotate(45deg);border:1px solid var(--gold)}
  .clist li.more{color:var(--muted);font-style:italic}
  .clist li.more::before{display:none}
  .clist .y{font:500 10.5px "JetBrains Mono",monospace;color:var(--gold);margin-right:6px}

  /* ---------- подвал: линейка и линия событий ---------- */
  footer{position:relative;z-index:5;padding:8px 0 12px;background:linear-gradient(0deg,rgba(7,9,20,.97),rgba(7,9,20,.88))}
  .f-row{display:flex;justify-content:space-between;align-items:baseline;padding:0 22px 6px;font-size:12px;color:var(--muted);gap:12px}
  .f-row .range{font:500 13px "JetBrains Mono",monospace;color:var(--text);white-space:nowrap}
  .f-row .range em{font-style:normal;color:var(--gold)}
  .hint{font-size:11px;color:#6f7895;flex:1;text-align:center}
  #stepLbl{white-space:nowrap}
  #ruler{display:block;width:100%;height:42px;cursor:grab;touch-action:none}

  .evline{position:relative;margin:4px 36px 0;height:40px;touch-action:none;cursor:pointer}
  .evline .track{position:absolute;left:0;right:0;top:12px;height:2px;background:linear-gradient(90deg,rgba(233,197,127,.25),rgba(233,197,127,.6),rgba(233,197,127,.25))}
  .evline .win{position:absolute;top:2px;height:22px;border:1px solid rgba(143,216,255,.7);background:rgba(143,216,255,.1);pointer-events:none;min-width:4px}
  .evline .dot{position:absolute;top:13px;width:22px;height:22px;margin:-11px 0 0 -11px;padding:0;border:none;background:transparent;cursor:pointer;z-index:2}
  .evline .dot::before{content:"";position:absolute;left:6px;top:6px;width:10px;height:10px;transform:rotate(45deg);border:1.5px solid var(--gold);background:#0d1124;transition:background .25s,box-shadow .25s,transform .2s}
  .evline .dot.multi::before{left:5px;top:5px;width:12px;height:12px}
  .evline .dot:hover::before,.evline .dot:focus-visible::before{transform:rotate(45deg) scale(1.3)}
  .evline .dot.lit::before{background:var(--gold);box-shadow:0 0 10px var(--gold)}
  .evline .dot.cur::before{box-shadow:0 0 0 3px rgba(143,216,255,.45),0 0 10px var(--gold)}
  .evline .dot:focus{outline:none}
  .evline .end{position:absolute;top:24px;font:500 11px "JetBrains Mono",monospace;color:var(--gold);transform:translateX(-50%);white-space:nowrap}
  .tip{position:fixed;z-index:20;pointer-events:none;max-width:260px;padding:6px 10px;font-size:12px;line-height:1.35;color:var(--text);
    background:rgba(13,17,36,.97);border:1px solid var(--gold-soft);transform:translate(-50%,-100%);opacity:0;transition:opacity .15s}
  .tip.show{opacity:1}
  .tip b{font:500 11px "JetBrains Mono",monospace;color:var(--gold);display:block;margin-bottom:2px}

  .status{position:absolute;inset:0;display:grid;place-items:center;z-index:6;text-align:center;padding:24px;color:var(--muted);pointer-events:none}
  .status .box{max-width:460px;border:1px solid var(--gold-soft);background:var(--panel);padding:22px 24px;pointer-events:auto}
  .status h2{font-family:"Cormorant Garamond",serif;color:var(--gold);margin:0 0 8px}
  .status code{color:var(--text);font-family:"JetBrains Mono",monospace;font-size:12px}

  /* ---------- телефон ---------- */
  @media (max-width:700px){
    :root{--cw:196px}
    header{flex-direction:column;align-items:stretch;gap:8px;padding:10px 12px 8px}
    .brand{gap:10px}
    .sigil{width:22px;height:22px}
    .sigil::after{width:8px;height:8px}
    .brand h1{font-size:21px}
    .brand .sub{display:none}
    .controls{justify-content:space-between;flex-wrap:nowrap;gap:4px}
    .btn{height:34px;min-width:0;flex:1;padding:0 6px}
    .btn .lbl,.sep,.hint{display:none}
    .head{padding:8px 10px 9px 13px}
    .head h3{font-size:17px}
    .body .pad{padding:0 11px 12px 13px}
    .body p{font-size:13px}
    .f-row{padding:0 12px 4px;font-size:11px}
    .f-row .range{font-size:12px}
    .evline{margin:2px 24px 0}
  }
</style>
</head>
<body>
<div class="sky"></div>
<div class="stars far" id="starsFar"></div>
<div class="stars" id="starsNear"></div>

<div class="app">
  <header>
    <div class="brand">
      <div class="sigil" aria-hidden="true"></div>
      <div>
        <h1 id="title">Хроники мира</h1>
        <div class="sub" id="subtitle">Летопись событий</div>
      </div>
    </div>
    <div class="controls">
      <button class="btn" id="prev" title="Предыдущее событие (←, Q)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl">Назад</span></button>
      <button class="btn" id="next" title="Следующее событие (→, E)"><span class="lbl">Вперёд</span><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <span class="sep"></span>
      <button class="btn" id="zoomOut" title="Отдалить (−)"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="btn" id="zoomIn" title="Приблизить (+)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="btn" id="fit" title="Показать все события (0)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl">Все события</span></button>
      <button class="btn" id="expandAll" title="Раскрыть / свернуть все"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span class="lbl">Раскрыть все</span></button>
    </div>
  </header>

  <main class="viewport" id="viewport">
    <div class="world" id="world"><div class="axis" id="axis"></div></div>
    <div class="status" id="status"><div class="box">Загрузка летописи…</div></div>
  </main>

  <footer>
    <div class="f-row">
      <span class="range" id="range">—</span>
      <span class="hint">Перетаскивайте мышью · колесо — масштаб · Shift+колесо — прокрутка · клик по карточке — подробнее</span>
      <span id="stepLbl">шаг —</span>
    </div>
    <canvas id="ruler"></canvas>
    <div class="evline" id="evline">
      <div class="track"></div>
      <div class="win" id="evWin"></div>
      <div id="evDots"></div>
      <span class="end" id="evStart" style="left:0"></span>
      <span class="end" id="evEnd" style="left:100%"></span>
    </div>
  </footer>
</div>
<div class="tip" id="tip"></div>

<script src="app.js"></script>
</body>
</html>
